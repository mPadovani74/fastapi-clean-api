# nginx na frente da API: limites, cache do GET /eventos, timeouts curtos.
# Para HTTPS: ponha o Cloudflare na frente (ele termina o TLS) ou use o certbot.
# Atrás do Cloudflare, descomente o bloco real_ip no fim para o limite por IP
# enxergar o visitante e não o servidor do Cloudflare.

worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    # Corpo pequeno e timeouts curtos: derrubam conexões lentas (slowloris).
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    # Limites por IP
    limit_req_zone  $binary_remote_addr zone=geral:10m rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m  rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conexoes:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Cache curto do GET /eventos (a rota pública mais exposta)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=eventos:10m
                     max_size=50m inactive=1m;

    upstream api {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        limit_conn conexoes 30;
        add_header X-Content-Type-Options nosniff always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sobrescreve (não acrescenta) o X-Forwarded-For: o cliente não
        # consegue forjar o IP que o limitador da API enxerga.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # A documentação interativa não existe em produção
        location ~ ^/(docs|redoc|openapi\.json) {
            return 404;
        }

        # Login, refresh, logout: 10 requisições por minuto por IP
        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api;
        }

        # Lista pública: cache de 5 s. Requisições com Authorization (admin)
        # não usam nem alimentam o cache. POST/PATCH/DELETE nunca são cacheados.
        location = /eventos {
            limit_req zone=geral burst=20 nodelay;
            proxy_cache eventos;
            proxy_cache_valid 200 5s;
            proxy_cache_lock on;
            proxy_cache_bypass $http_authorization;
            proxy_no_cache     $http_authorization;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://api;
        }

        location / {
            limit_req zone=geral burst=20 nodelay;
            proxy_pass http://api;
        }
    }

    # --- Atrás do Cloudflare: use as faixas de IP de
    #     https://www.cloudflare.com/ips/ (mudam com o tempo)
    # set_real_ip_from 173.245.48.0/20;   # ... demais faixas
    # real_ip_header CF-Connecting-IP;
}
