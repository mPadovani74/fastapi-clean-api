
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    limit_req_zone  $binary_remote_addr zone=geral:10m rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m  rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conexoes:10m;
    limit_req_status  429;
    limit_conn_status 429;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=eventos:10m
                     max_size=50m inactive=1m;

    upstream api {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        limit_conn conexoes 30;
        add_header X-Content-Type-Options nosniff always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        location ~ ^/(docs|redoc|openapi\.json) {
            return 404;
        }

        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api;
        }

        location = /eventos {
            limit_req zone=geral burst=20 nodelay;
            proxy_cache eventos;
            proxy_cache_valid 200 5s;
            proxy_cache_lock on;
            proxy_cache_bypass $http_authorization;
            proxy_no_cache     $http_authorization;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://api;
        }

        location / {
            limit_req zone=geral burst=20 nodelay;
            proxy_pass http://api;
        }
    }

}
